map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- RATE LIMITING & ANTI-DDOS ZONES ---
# Track client IPs using 10MB memory (~160,000 active concurrent IPs)
limit_req_zone $binary_remote_addr zone=general_req_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_req_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=ws_req_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ip_conn_limit:10m;

# Return HTTP 429 Too Many Requests when rate limit exceeded
limit_req_status 429;
limit_conn_status 429;

# 0. Local Development Server on localhost / 127.0.0.1 (ZERO redirects, direct local testing on port 80 & 3000)
server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# 1. Port 80: Redirect ALL External HTTP traffic to HTTPS domain
server {
    listen 80 default_server;
    server_name _;
    return 301 https://guessiha.duckdns.org$request_uri;
}

# 2. Port 443 Default: Reject or redirect direct IP access to HTTPS domain
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/guessiha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessiha.duckdns.org/privkey.pem;

    return 301 https://guessiha.duckdns.org$request_uri;
}

# 3. Port 443 Primary: ONLY serve the game on guessiha.duckdns.org
server {
    listen 443 ssl;
    server_name guessiha.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/guessiha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessiha.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Maximum 25 concurrent connections per IP address
    limit_conn ip_conn_limit 25;

    # General page load rate limit (20 req/s + 40 burst)
    limit_req zone=general_req_limit burst=40 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy REST API & SSE Streams to backend (Protected with 15 req/s + 25 burst)
    location /api/ {
        limit_req zone=api_req_limit burst=25 nodelay;
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy WebSockets & Polling to backend (Protected with 30 req/s + 50 burst)
    location /socket.io/ {
        limit_req zone=ws_req_limit burst=50 nodelay;
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
