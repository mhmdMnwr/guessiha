map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Port 80: Redirect ALL HTTP traffic (IP or domain) to HTTPS domain
server {
    listen 80 default_server;
    server_name _;
    return 301 https://guessiha.duckdns.org$request_uri;
}

# 2. Port 443 Default: Reject or redirect direct IP access to HTTPS domain
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/guessiha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessiha.duckdns.org/privkey.pem;

    return 301 https://guessiha.duckdns.org$request_uri;
}

# 3. Port 443 Primary: ONLY serve the game on guessiha.duckdns.org
server {
    listen 443 ssl;
    server_name guessiha.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/guessiha.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guessiha.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Proxy REST API & SSE Streams to backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy WebSockets & Polling to backend
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
